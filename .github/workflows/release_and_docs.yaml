name: Release and Deploy Versioned Docs

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine packaging
      - run: python -m unittest discover -s .github/tests -v
      - name: Verify release version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/release.py verify
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'RosettaCommons/atomworks' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atomworks
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: legacy
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

  docs:
    needs: build
    if: github.repository == 'RosettaCommons/atomworks' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: atomworks-versioned-docs
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m pip install '.[ml,docs]' -r docs/docs_requirements.txt
          python -m pip install packaging
      - name: Build documentation for the tag
        run: |
          export ATOMWORKS_DOCS_VERSION="${GITHUB_REF_NAME#v}"
          cd docs
          python -m sphinx -b html . _build/html
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Prepare versioned documentation
        run: python .github/release.py docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          keep_files: false
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
