name: lint_and_test

on:
  push:
    branches:
      - dev
      - main
      - production
      - release/atomworks-3-0
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - dev
      - staging
      - production
      - release/atomworks-3-0
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request_target:
    types: [ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/lint-venv"
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
      - name: Extract ruff version and install
        run: |
          RUFF_VERSION=$(grep -E 'ruff.*=' pyproject.toml | sed -E 's/.*\"ruff==([^\"]+)\".*/\1/')
          echo "Extracted Ruff version: $RUFF_VERSION"
          pip install ruff==$RUFF_VERSION
      - name: ruff format (check code formatting)
        run: ruff format --diff
      - name: ruff check (lint code base)
        run: ruff check src tests

  test_digs:
    name: pytest (jojo)
    runs-on: [self-hosted]
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        env:
          ATOMWORKS_CI_CONTAINER: ${{ vars.ATOMWORKS_CI_CONTAINER }}
          ATOMWORKS_CI_TEST_PACK: ${{ vars.ATOMWORKS_CI_TEST_PACK }}
        run: |
          export N_CPU=8
          srun --chdir=$PWD -p cpu -c $N_CPU -t 00:30:00 --mem=32G bash ./.github/ci/run_tests.sh
      - name: Upload coverage to Codecov
        if: success() && github.event_name != 'pull_request_target'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ${{ github.workspace }}/coverage.xml
          fail_ci_if_error: false
